<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <nav class="bg-green-100 p-4 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <h1 class="text-2xl">Greenden</h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="size-6 md:hidden">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>


        <ul class="flex gap-6 text-gray-600 hidden md:flex">
            <li>
                <a class="hover:underline hover:text-black" href="./index.html">Home</a>
            </li>

            <li>
                <a class="hover:underline hover:text-black" href="contact.html">Contact</a>
            </li>

            <li>
                <a class="hover:underline hover:text-black" href="product.html">Products</a>
            </li>
        </ul>
    </nav>
<section class="bg-white">
    <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">

        <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-black">
            Contact Us
        </h2>

        <p class="mb-8 lg:mb-16 font-light text-center text-gray-700 sm:text-xl">
            Got a technical issue? Want to send feedback about a beta feature?
            Need details about our Business plan? Let us know.
        </p>

        <form action="#" class="space-y-8">

            <!-- Email -->
            <div>
                <label for="email"
                    class="block mb-2 text-sm font-medium text-black">
                    Your email
                </label>

                <input type="email"
                    id="email"
                    class="block w-full p-3 text-sm text-black bg-white border border-gray-400 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                    placeholder="name@example.com"
                    required>
            </div>

            <!-- Subject -->
            <div>
                <label for="subject"
                    class="block mb-2 text-sm font-medium text-black">
                    Subject
                </label>

                <input type="text"
                    id="subject"
                    class="block w-full p-3 text-sm text-black bg-white border border-gray-400 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                    placeholder="Let us know how we can help you"
                    required>
            </div>

            <!-- Message -->
            <div>
                <label for="message"
                    class="block mb-2 text-sm font-medium text-black">
                    Your message
                </label>

                <textarea id="message"
                    rows="6"
                    class="block w-full p-3 text-sm text-black bg-white border border-gray-400 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                    placeholder="Leave a comment..."></textarea>
            </div>

            <!-- Button -->
            <button type="submit"
                class="py-3 px-5 text-sm font-medium text-white bg-black rounded-lg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300">
                Send message
            </button>

        </form>
    </div>
</section>
    <section class="p-6 mt-2 bg-green-100">
        <div>
            <h1 class="font-bold text-3xl mt-3 py-1">Greenden</h1>
            <p class="mt-4">The Standard chunk lorem ipsum used since 1500s is responded below for thosee intrest</p>
            <P class="mt-4"> &copy; 2021 Greenday.com</P>
        </div>
    </section>
</body>

</html>
