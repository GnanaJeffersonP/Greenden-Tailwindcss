<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .container {
            background-color: lightblue;
            padding: 20px;
        }

        .header {
            background-color: aquamarine;
            color: white;
            height: 100px;

            display: grid;
            place-items: center;
        }

        .middle {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin: 20px 0;
        }

        .aside {
            background-color: greenyellow;
            color: white;
            min-height: 500px;

            display: grid;
            place-items: center;
        }

        .article {
            background-color: orange;
            color: white;
            min-height: 500px;

            display: grid;
            grid-template-rows: 1fr auto;
            padding: 20px;
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .image1,
        .image2,
        .image3 {
            background-color: rgb(214, 176, 105);
            height: 150px;

            display: grid;
            place-items: center;
        }

        .footer {
            background-color: aquamarine;
            color: white;
            height: 100px;

            display: grid;
            place-items: center;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            Header
        </div>

        <div class="middle">

            <div class="aside">
                Aside
            </div>

            <div class="article">

                <div>
                    Article
                </div>

                <div class="images">

                    <div class="image1">
                        Image
                    </div>

                    <div class="image2">
                        Image
                    </div>

                    <div class="image3">
                        Image
                    </div>

                </div>

            </div>

        </div>

        <div class="footer">
            Footer
        </div>

    </div>

</body>
</html>
